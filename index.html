<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>御剑苍穹 · 武侠弹幕射击</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:radial-gradient(ellipse at 50% 30%,#0d1530 0%,#05070f 70%);overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:12px;box-shadow:0 0 60px rgba(80,180,255,.25),0 0 120px rgba(120,80,255,.12),inset 0 0 30px rgba(0,0,0,.4);touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=480,H=720;
canvas.width=W;canvas.height=H;
function fit(){const rw=window.innerWidth,rh=window.innerHeight;const s=Math.min(rw/W,rh/H)*0.96;canvas.style.width=(W*s)+"px";canvas.style.height=(H*s)+"px";}
window.addEventListener("resize",fit);fit();

const SWORDS=[
  {name:"青锋剑",color:"#8fe3ff",dmg:18,cd:26,kind:"straight",desc:"直线剑气",level:0},
  {name:"雷纹剑",color:"#ffd27f",dmg:12,cd:36,kind:"spread",desc:"扇形散射",level:0},
  {name:"流影剑",color:"#ff9de0",dmg:14,cd:34,kind:"homing",desc:"追踪剑气",level:0},
  {name:"玄重剑",color:"#b9a8ff",dmg:55,cd:70,kind:"pierce",desc:"穿透重剑",level:0},
];
function swordDmg(i){return SWORDS[i].dmg*(1+SWORDS[i].level*.18)}
function swordCd(i){return SWORDS[i].cd*(1-SWORDS[i].level*.06)}

let G=null;
function newGame(){
  for(const s of SWORDS)s.level=0;
  G={state:"menu",player:{x:W/2,y:H-130,w:34,h:44,hp:100,maxHp:100,invuln:0,fireCd:0},
    bullets:[],enemyBullets:[],enemies:[],particles:[],floats:[],drops:[],
    sword:0,score:0,kills:0,level:1,levelKills:0,needKills:10,
    boss:null,bossSpawned:false,shieldOn:false,shieldCd:0,blastCd:0,
    buffTime:0,buffDmg:1,buffCd:1,drag:false,pointer:{x:0,y:0},
    time:0,shake:0,hitFlash:0,bgPetals:[],stars:[],mountains:[],
    switchFlash:0,switchColor:"#8fe3ff",trail:[],lastCharClick:0,blastFx:null};
  for(let i=0;i<25;i++)G.bgPetals.push({x:Math.random()*W,y:Math.random()*H,vx:rand(-.4,.4),vy:rand(.4,1.2),r:rand(1.5,3),a:rand(.2,.5),rot:rand(0,7),vr:rand(-.02,.02)});
  for(let i=0;i<60;i++)G.stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:rand(.5,1.8),a:rand(.3,.9),tw:rand(0,Math.PI*2),ts:rand(.02,.06)});
  G.mountains=[{y:.52,amp:35,spd:.018,col:"rgba(40,70,130,.22)"},{y:.62,amp:28,spd:.025,col:"rgba(30,55,110,.28)"},{y:.72,amp:22,spd:.032,col:"rgba(20,40,85,.35)"}];
}
newGame();

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function floatText(txt,col,x,y,size){G.floats.push({x:x||rand(100,W-100),y:y||200,txt,col:col||"#ffd27f",life:55,max:55,size:size||15})}
function addParticle(x,y,col,n,sp,size){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(.6,sp||2.5);G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(14,32),max:32,r:rand(1,size||2.4),col});}}
function addRing(x,y,col,r){G.particles.push({x,y,vx:0,vy:0,life:24,max:24,r:r||20,col,ring:true,maxR:r||20})}
function spawnDrop(x,y,type){const col=type==="heal"?"#5fe08a":"#ffd27f";G.drops.push({x,y,vy:1.2,type,col,r:12,life:600,t:0})}
function pickupDrop(d){
  if(d.type==="heal"){G.player.hp=Math.min(G.player.maxHp,G.player.hp+25);floatText("+25 气血","#5fe08a",G.player.x,G.player.y-30,14);addParticle(G.player.x,G.player.y,"#5fe08a",18,3,2.5);addRing(G.player.x,G.player.y,"#5fe08a",35);}
  else{G.buffTime=600;G.buffDmg=1.6;G.buffCd=0.65;floatText("剑气强化·10秒","#ffd27f",G.player.x,G.player.y-30,14);addParticle(G.player.x,G.player.y,"#ffd27f",22,3.5,2.8);addRing(G.player.x,G.player.y,"#ffd27f",40);}
}
function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)}}
const DOUBLE_CLICK_MS=320;
function onDown(e){
  e.preventDefault();const p=getPos(e);G.pointer=p;
  if(G.state==="menu"){if(p.y>H-120&&p.y<H-60&&p.x>W/2-90&&p.x<W/2+90){G.state="manual";}return;}
  if(G.state==="manual"){if(p.y>H-100&&p.y<H-45&&p.x>W/2-100&&p.x<W/2+100){G.state="play";}return;}
  if(G.state==="over"){if(p.y>H-130&&p.y<H-70){newGame();G.state="play";}return;}
  if(G.state==="play"){
    const pDist=Math.hypot(p.x-G.player.x,p.y-G.player.y);
    if(pDist<58){const now=Date.now();if(now-G.lastCharClick<DOUBLE_CLICK_MS){G.sword=(G.sword+1)%4;const s=SWORDS[G.sword];G.switchFlash=28;G.switchColor=s.color;floatText("切换·"+s.name,s.color,W/2,H-90,16);addParticle(G.player.x,G.player.y,s.color,30,4.5,2.8);addRing(G.player.x,G.player.y,s.color,42);G.shake=3;G.lastCharClick=0;G.drag=false;return;}else{G.lastCharClick=now;}}
  }
  if(handleBtn(p))return;
  if(p.y>120){G.drag=true;G.player.x=Math.max(20,Math.min(W-20,p.x));G.player.y=Math.max(H*0.4,Math.min(H-70,p.y));}
}
function onMove(e){e.preventDefault();const p=getPos(e);G.pointer=p;if(G.drag&&G.state==="play"){G.player.x=Math.max(20,Math.min(W-20,p.x));G.player.y=Math.max(H*0.4,Math.min(H-70,p.y));}}
function onUp(e){e.preventDefault();G.drag=false;}
canvas.addEventListener("mousedown",onDown);canvas.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);
canvas.addEventListener("touchstart",onDown,{passive:false});canvas.addEventListener("touchmove",onMove,{passive:false});canvas.addEventListener("touchend",onUp,{passive:false});

const BTNS={swords:[{x:24,y:H-54,w:56,h:38},{x:88,y:H-54,w:56,h:38},{x:152,y:H-54,w:56,h:38},{x:216,y:H-54,w:56,h:38}],shield:{x:300,y:H-54,w:68,h:38},blast:{x:380,y:H-54,w:68,h:38}};
function inBtn(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
function handleBtn(p){if(inBtn(p,BTNS.shield)){useShield();return true;}if(inBtn(p,BTNS.blast)){useBlast();return true;}return false;}
function useShield(){if(G.shieldCd>0)return;G.shieldCd=480;G.shieldOn=true;G.player.hp=Math.min(G.player.maxHp,G.player.hp+20);floatText("护体剑气","#7fe0ff");addParticle(G.player.x,G.player.y,"#7fe0ff",24,3.5,2.5);addRing(G.player.x,G.player.y,"#7fe0ff",50);}
function useBlast(){
  if(G.blastCd>0)return;G.blastCd=600;G.shake=14;G.enemyBullets.length=0;
  for(const e of G.enemies){e.hp-=40;addParticle(e.x,e.y,e.color,12,3.5,2.8);}
  G.enemies=G.enemies.filter(e=>e.hp>0);if(G.boss&&!G.enemies.includes(G.boss))G.boss=null;
  const swords=[];
  for(let i=0;i<36;i++){const side=Math.floor(Math.random()*4);let x,y,vx,vy;
    if(side===0){x=rand(-50,W+50);y=-40;vx=rand(-1,1);vy=rand(3.5,6);}
    else if(side===1){x=W+40;y=rand(-50,H+50);vx=rand(-6,-3.5);vy=rand(-1,1);}
    else if(side===2){x=rand(-50,W+50);y=H+40;vx=rand(-1,1);vy=rand(-6,-3.5);}
    else{x=-40;y=rand(-50,H+50);vx=rand(3.5,6);vy=rand(-1,1);}
    swords.push({x,y,vx,vy,rot:Math.atan2(vy,vx),len:rand(28,44),col:["#8fe3ff","#ffd27f","#b9a8ff","#ff9de0","#7fe0ff"][i%5],delay:rand(0,15)});}
  G.blastFx={time:0,swords,maxTime:130};addRing(W/2,H/2,"#ffd27f",220);addRing(W/2,H/2,"#8fe3ff",160);
}
function playerShoot(){
  const p=G.player,s=SWORDS[G.sword];const dmg=swordDmg(G.sword)*G.buffDmg;const sizeMul=1+s.level*.08;
  if(s.kind==="straight"){G.bullets.push({x:p.x,y:p.y-24,vx:0,vy:-9,r:6*sizeMul,dmg,col:s.color,pierce:0,homing:0,trail:[]});}
  else if(s.kind==="spread"){[-.22,-.07,.07,.22].forEach(o=>{G.bullets.push({x:p.x,y:p.y-22,vx:o*5,vy:-8.5,r:5*sizeMul,dmg,col:s.color,pierce:0,homing:0,trail:[]});});}
  else if(s.kind==="homing"){G.bullets.push({x:p.x,y:p.y-22,vx:0,vy:-7,r:5.5*sizeMul,dmg,col:s.color,pierce:0,homing:1,trail:[]});}
  else{G.bullets.push({x:p.x,y:p.y-26,vx:0,vy:-6.5,r:10*sizeMul,dmg,col:s.color,pierce:1,homing:0,trail:[]});}
}
function spawnEnemy(){
  const lv=G.level,x=rand(30,W-30),r=Math.random();let e;
  if(r<0.5){e={kind:"fly",x,y:-30,w:28,h:28,hp:25+lv*6,maxHp:25+lv*6,vx:0,vy:rand(.7,1.3)+lv*.12,shoot:150+lv*8,color:"#ff6b8a",score:10,t:0,phase:rand(0,6)};}
  else if(r<0.78){e={kind:"sine",x,y:-30,w:26,h:26,hp:20+lv*5,maxHp:20+lv*5,vx:0,vy:rand(.9,1.6)+lv*.1,shoot:155+lv*8,color:"#c98bff",score:15,t:0,phase:rand(0,6)};}
  else if(r<0.93){e={kind:"gunner",x,y:-30,w:32,h:32,hp:45+lv*10,maxHp:45+lv*10,vx:0,vy:rand(.5,.9),shoot:185+lv*8,color:"#ffb35d",score:25,t:0,phase:rand(0,6)};}
  else{e={kind:"tank",x,y:-40,w:42,h:42,hp:100+lv*20,maxHp:100+lv*20,vx:0,vy:rand(.35,.65),shoot:210+lv*8,color:"#8fe3ff",score:40,t:0,phase:rand(0,6)};}
  G.enemies.push(e);
}
function enemyShoot(e){const p=G.player;const a=Math.atan2(p.y-e.y,p.x-e.x)+rand(-.1,.1);const sp=1.4+G.level*.07;G.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5.5,col:"#ff5d7e",life:400});if(e.kind==="gunner"){for(let i=0;i<2;i++){const aa=(i/2)*Math.PI*2+G.time*.04;G.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(aa)*1.1,vy:Math.sin(aa)*1.1,r:4.5,col:"#ffb35d",life:420});}}}
function spawnBoss(){
  const lv=G.level;let bossType="demon",bossName="剑魔",bossColor="#c41e3a",warnColor="#ff2244";
  if(lv===2){bossType="golden";bossName="金袍国师";bossColor="#c49a1a";warnColor="#ffaa00";}
  else if(lv===3){bossType="shadow";bossName="流影妖姬";bossColor="#d63384";warnColor="#ff6dd0";}
  else if(lv===4){bossType="heavy";bossName="玄重魔尊";bossColor="#7c3aed";warnColor="#9a7fff";}
  else if(lv>4){bossType=lv%2?"shadow":"heavy";bossName=lv%2?"流影妖姬":"玄重魔尊";bossColor=lv%2?"#d63384":"#7c3aed";warnColor=lv%2?"#ff6dd0":"#9a7fff";}
  const b={kind:"boss",x:W/2,y:-80,w:130,h:100,hp:600+lv*220,maxHp:600+lv*220,vx:0,vy:1.0,shoot:60,color:bossColor,score:500,t:0,boss:true,entered:false,eyePulse:0,bossType,bossName};
  G.boss=b;G.enemies.push(b);floatText("⚠ 首领·"+bossName+"降临 ⚠",warnColor,W/2,130,22);G.shake=14;addRing(W/2,110,bossColor,180);addRing(W/2,110,bossColor+"88",120);
}
function bossAI(b){
  b.t++;b.eyePulse+=.08;if(!b.entered){b.y+=1.0;if(b.y>=100)b.entered=true;return;}
  b.x=W/2+Math.sin(b.t*.015)*120;
  if(b.bossType==="golden"){
    if(b.t%210===0){for(let i=-1;i<=2;i++){const a=Math.PI/2+i*.3;G.enemyBullets.push({x:b.x,y:b.y+35,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,r:6.5,col:"#ffaa00",life:500});}}
    if(b.t%200===0){for(let side=-1;side<=1;side+=2){for(let i=0;i<3;i++){const baseA=side>0?0:Math.PI;const a=baseA+(i-1)*.25+Math.sin(b.t*.02)*.1;G.enemyBullets.push({x:b.x+side*40,y:b.y+10,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8+0.3,r:5.5,col:"#ffd27f",life:450});}}}
    if(b.t%240===0){const off=b.t*.04;for(let i=0;i<5;i++){const aa=(i/5)*Math.PI*2+off;G.enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(aa)*.8,vy:Math.sin(aa)*.8,r:5,col:"#ff8800",life:500});}}
  }else if(b.bossType==="shadow"){
    if(b.t%180===0){for(let i=0;i<2;i++){const ox=(i-.5)*50;G.enemyBullets.push({x:b.x+ox,y:b.y+20,vx:rand(-1,1),vy:1.4,r:6,col:"#ff6dd0",life:550,homing:1});}}
    if(b.t%220===0){for(let i=-1;i<=2;i++){const a=Math.PI/2+i*.3;G.enemyBullets.push({x:b.x,y:b.y+30,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,r:5.5,col:"#ff9de0",life:450});}}
    if(b.t%260===0){const off=b.t*.05;for(let i=0;i<4;i++){const aa=(i/4)*Math.PI*2+off;G.enemyBullets.push({x:b.x+Math.cos(aa)*30,y:b.y+Math.sin(aa)*20,vx:Math.cos(aa)*.7,vy:Math.sin(aa)*.7,r:5,col:"#d63384",life:500,homing:1});}}
  }else if(b.bossType==="heavy"){
    if(b.t%240===0){G.enemyBullets.push({x:b.x,y:b.y+30,vx:0,vy:1.1,r:11,col:"#9a7fff",life:650,pierce:1});}
    if(b.t%200===0){for(let i=-1;i<=2;i++){const a=Math.PI/2+i*.32;G.enemyBullets.push({x:b.x,y:b.y+35,vx:Math.cos(a)*1.2,vy:Math.sin(a)*1.2,r:8,col:"#b9a8ff",life:500});}}
    if(b.t%280===0){const off=b.t*.02;for(let i=0;i<5;i++){const aa=(i/5)*Math.PI*2+off;G.enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(aa)*.6,vy:Math.sin(aa)*.6,r:6.5,col:"#7c3aed",life:550});}}
  }else{
    if(b.t%200===0){for(let i=-1;i<=2;i++){const a=Math.PI/2+i*.32;G.enemyBullets.push({x:b.x,y:b.y+30,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,r:7,col:"#ff2244",life:550});}}
    if(b.t%180===0){const off=b.t*.03;for(let i=0;i<4;i++){const aa=(i/4)*Math.PI*2+off;G.enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(aa)*.8,vy:Math.sin(aa)*.8,r:5,col:"#ffaa33",life:550});}}
  }
}
function update(){
  G.time++;const p=G.player;
  if(p.invuln>0)p.invuln--;p.fireCd--;
  if(p.fireCd<=0){playerShoot();p.fireCd=swordCd(G.sword)*G.buffCd;}
  if(G.shieldCd>0)G.shieldCd--;if(G.blastCd>0)G.blastCd--;
  if(G.shieldOn&&G.shieldCd<=420)G.shieldOn=false;
  if(G.switchFlash>0)G.switchFlash--;
  if(G.buffTime>0){G.buffTime--;if(G.buffTime<=0){G.buffDmg=1;G.buffCd=1;}}
  G.trail.unshift({x:p.x,y:p.y});if(G.trail.length>8)G.trail.pop();
  for(let i=G.bullets.length-1;i>=0;i--){const b=G.bullets[i];b.trail=b.trail||[];b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>5)b.trail.pop();b.x+=b.vx;b.y+=b.vy;if(b.homing&&G.enemies.length){let best=null,bd=1e9;for(const e of G.enemies){const d=dist(b,e);if(d<bd){bd=d;best=e;}}if(best){const a=Math.atan2(best.y-b.y,best.x-b.x);b.vx+=(Math.cos(a)*6-b.vx)*.1;b.vy+=(Math.sin(a)*6-b.vy)*.1;}}if(b.y<-30||b.x<-30||b.x>W+30)G.bullets.splice(i,1);}
  if(!G.boss&&G.enemies.length<6&&G.time%Math.max(50,95-G.level*5)===0)spawnEnemy();
  if(!G.bossSpawned&&G.levelKills>=G.needKills&&!G.boss){spawnBoss();G.bossSpawned=true;}
  for(let i=G.enemies.length-1;i>=0;i--){const e=G.enemies[i];e.t++;
    if(e.kind==="boss"){bossAI(e);}else{if(e.kind==="sine")e.x+=Math.sin(e.t*.05+e.phase)*1.6;e.y+=e.vy;if(e.t%e.shoot===0&&e.y>20&&e.y<H-100)enemyShoot(e);}
    if(e.y>H+50){G.enemies.splice(i,1);continue;}
    for(let j=G.bullets.length-1;j>=0;j--){const b=G.bullets[j];if(dist(b,e)<e.w/2+7){e.hp-=b.dmg;addParticle(b.x,b.y,e.color,5,2.2,2);if(!b.pierce)G.bullets.splice(j,1);
      if(e.hp<=0){G.score+=e.score;G.kills++;G.levelKills++;addParticle(e.x,e.y,e.color,14,3.5,2.5);addRing(e.x,e.y,e.color,e.w);floatText("+"+e.score,"#ffd27f",e.x,e.y,13);
        if(e.boss){G.boss=null;G.score+=150;floatText("首领击破！","#6fe0ff",W/2,H/2,22);spawnDrop(e.x-20,e.y,"heal");spawnDrop(e.x+20,e.y,"power");
          const swordIdx=G.level-1;if(swordIdx>=0&&swordIdx<4){SWORDS[swordIdx].level++;const s=SWORDS[swordIdx];floatText(s.name+" 强化+"+s.level+"！",s.color,W/2,H/2+35,18);addParticle(W/2,H/2+35,s.color,30,4,3);addRing(W/2,H/2+35,s.color,60);}
          nextLevel();}else if(Math.random()<0.18){spawnDrop(e.x,e.y,Math.random()<0.55?"heal":"power");}
        G.enemies.splice(i,1);break;}}}}
  for(let i=G.enemyBullets.length-1;i>=0;i--){const b=G.enemyBullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;if(b.homing){const a=Math.atan2(p.y-b.y,p.x-b.x);b.vx+=(Math.cos(a)*2.4-b.vx)*.04;b.vy+=(Math.sin(a)*2.4-b.vy)*.04;}
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30||b.life<=0){G.enemyBullets.splice(i,1);continue;}
    if(dist(b,p)<p.w/2+5&&p.invuln<=0){if(G.shieldOn){addParticle(b.x,b.y,"#7fe0ff",10,3,2.5);G.enemyBullets.splice(i,1);continue;}
      p.hp-=12;p.invuln=40;G.hitFlash=10;G.shake=6;addParticle(p.x,p.y,"#ff5d7e",16,3.5,2.5);G.enemyBullets.splice(i,1);
      if(p.hp<=0){p.hp=0;G.state="over";G.shake=14;addParticle(p.x,p.y,"#ff5d7e",40,5.5,3.5);addRing(p.x,p.y,"#ff5d7e",60);}}}

      const heavyAura=ctx.createRadialGradient(0,0,25,0,0,100);heavyAura.addColorStop(0,"rgba(124,58,237,.4)");heavyAura.addColorStop(.5,"rgba(154,127,255,.2)");heavyAura.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=heavyAura;ctx.beginPath();ctx.arc(0,0,100,0,7);ctx.fill();
      const chestGrd=ctx.createLinearGradient(-35,-25,35,15);chestGrd.addColorStop(0,"#5a2a9a");chestGrd.addColorStop(.5,"#4a2080");chestGrd.addColorStop(1,"#2a1050");ctx.fillStyle=chestGrd;
      ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(32,-18);ctx.lineTo(35,12);ctx.lineTo(25,15);ctx.lineTo(0,10);ctx.lineTo(-25,15);ctx.lineTo(-35,12);ctx.lineTo(-32,-18);ctx.closePath();ctx.fill();ctx.strokeStyle="#b9a8ff";ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle="#b9a8ff";ctx.shadowBlur=15;ctx.shadowColor="#9a7fff";ctx.beginPath();ctx.arc(0,-5,6,0,7);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#1a0830";ctx.fillRect(-10,-38,20,4);ctx.fillStyle="#b9a8ff";ctx.shadowBlur=12;ctx.shadowColor="#9a7fff";ctx.fillRect(-8,-37.5,5,3);ctx.fillRect(3,-37.5,5,3);ctx.shadowBlur=0;
    }else{
      const auraGrd=ctx.createRadialGradient(0,0,20,0,0,90);auraGrd.addColorStop(0,"rgba(196,30,58,.3)");auraGrd.addColorStop(.5,"rgba(139,0,0,.15)");auraGrd.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=auraGrd;ctx.beginPath();ctx.arc(0,0,90,0,7);ctx.fill();
      const bodyGrd=ctx.createLinearGradient(0,-50,0,50);bodyGrd.addColorStop(0,"#3a0a12");bodyGrd.addColorStop(.3,"#5c1020");bodyGrd.addColorStop(.7,"#3a0a12");bodyGrd.addColorStop(1,"#1a0508");ctx.fillStyle=bodyGrd;
      ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(45,-30);ctx.lineTo(58,0);ctx.lineTo(45,30);ctx.lineTo(0,52);ctx.lineTo(-45,30);ctx.lineTo(-58,0);ctx.lineTo(-45,-30);ctx.closePath();ctx.fill();ctx.strokeStyle="#8b0000";ctx.lineWidth=3;ctx.shadowBlur=20;ctx.shadowColor="#c41e3a";ctx.stroke();ctx.shadowBlur=0;
      const eyeR=22*pulse;ctx.fillStyle="#ff2244";ctx.shadowBlur=25*pulse;ctx.shadowColor="#ff2244";ctx.beginPath();ctx.ellipse(0,0,eyeR+4,eyeR*.7,0,0,7);ctx.fill();ctx.fillStyle="#1a0000";ctx.beginPath();ctx.ellipse(0,0,eyeR*.35,eyeR*.55,0,0,7);ctx.fill();ctx.shadowBlur=0;
    }
    ctx.restore();
    const barW=200,barH=12,barX=e.x-barW/2,barY=e.y-72;const bt=e.bossType;
    const isGolden=bt==="golden",isShadow=bt==="shadow",isHeavy=bt==="heavy";
    ctx.fillStyle="rgba(0,0,0,.7)";roundRect(barX-2,barY-2,barW+4,barH+4,4);ctx.fill();
    const hpGrd=ctx.createLinearGradient(barX,0,barX+barW,0);
    if(isGolden){hpGrd.addColorStop(0,"#8a6a10");hpGrd.addColorStop(.5,"#c49a1a");hpGrd.addColorStop(1,"#ffd27f");}
    else if(isShadow){hpGrd.addColorStop(0,"#8a1a4a");hpGrd.addColorStop(.5,"#d63384");hpGrd.addColorStop(1,"#ff9de0");}
    else if(isHeavy){hpGrd.addColorStop(0,"#4a2080");hpGrd.addColorStop(.5,"#7c3aed");hpGrd.addColorStop(1,"#b9a8ff");}
    else{hpGrd.addColorStop(0,"#8b0000");hpGrd.addColorStop(.5,"#ff2244");hpGrd.addColorStop(1,"#ff6666");}
    const glowCol=isGolden?"#ffd27f":isShadow?"#ff6dd0":isHeavy?"#9a7fff":"#ff2244";
    ctx.fillStyle=hpGrd;ctx.shadowBlur=10;ctx.shadowColor=glowCol;roundRect(barX,barY,barW*(e.hp/e.maxHp),barH,3);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText(e.bossName+" "+Math.ceil(e.hp)+"/"+e.maxHp,e.x,barY-5);
  }else{
    const r=e.w/2;ctx.save();ctx.translate(e.x,e.y);const t=e.t;
    if(e.kind==="fly"){
      ctx.fillStyle=e.color;ctx.shadowBlur=4;ctx.shadowColor=e.color;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,0);ctx.lineTo(5,10);ctx.lineTo(-5,10);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#e8c8a8";ctx.beginPath();ctx.arc(0,-12,5.5,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,-13,5.5,Math.PI,0);ctx.fill();ctx.fillRect(-5.5,-13,11,3);
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-2,-11,1.2,0,7);ctx.arc(2,-11,1.2,0,7);ctx.fill();
    }else if(e.kind==="sine"){
      const robeGrd=ctx.createLinearGradient(0,-6,0,14);robeGrd.addColorStop(0,e.color);robeGrd.addColorStop(1,e.color+"66");ctx.fillStyle=robeGrd;ctx.shadowBlur=5;ctx.shadowColor=e.color;
      ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(9,0);ctx.lineTo(11,13);ctx.lineTo(-11,13);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#e8c8a8";ctx.beginPath();ctx.arc(0,-11,5,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.moveTo(-4,-14);ctx.lineTo(0,-20);ctx.lineTo(4,-14);ctx.closePath();ctx.fill();
    }else if(e.kind==="gunner"){
      ctx.fillStyle=e.color;ctx.shadowBlur=4;ctx.shadowColor=e.color;roundRect(-7,-6,14,15,3);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#e8c8a8";ctx.beginPath();ctx.arc(0,-11,5,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,-12,5.2,Math.PI*1.1,Math.PI*1.9);ctx.fill();
      ctx.strokeStyle="#8a5a2a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(10,0,9,-Math.PI/2.5,Math.PI/2.5);ctx.stroke();
    }else{
      ctx.fillStyle=e.color;ctx.shadowBlur=5;ctx.shadowColor=e.color;roundRect(-10,-8,20,20,4);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#e8c8a8";ctx.beginPath();ctx.arc(0,-13,4.5,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,-14,5.5,Math.PI,0);ctx.fill();ctx.fillRect(-5.5,-14,11,4);
      ctx.fillStyle="#1a0a0a";ctx.fillRect(-4,-13,8,1.5);ctx.fillStyle="#ff5d7e";ctx.fillRect(-3.5,-12.8,2.5,1);ctx.fillRect(1,-12.8,2.5,1);
    }
    ctx.restore();
    if(e.hp<e.maxHp){ctx.fillStyle="rgba(0,0,0,.55)";roundRect(e.x-r,e.y-r-12,r*2,4.5,2);ctx.fill();ctx.fillStyle="#ff3d6e";roundRect(e.x-r,e.y-r-12,r*2*(e.hp/e.maxHp),4.5,2);ctx.fill();}
  }
  ctx.shadowBlur=0;
}
function drawHUD(){
  ctx.fillStyle="rgba(0,0,0,.5)";roundRect(10,10,164,20,5);ctx.fill();
  const hpRatio=G.player.hp/G.player.maxHp;const hpGrd=ctx.createLinearGradient(12,0,172,0);
  if(hpRatio>.3){hpGrd.addColorStop(0,"#3dd68c");hpGrd.addColorStop(1,"#5fe08a");}else{hpGrd.addColorStop(0,"#ff3d6e");hpGrd.addColorStop(1,"#ff5d7e");}
  ctx.fillStyle=hpGrd;roundRect(12,12,160*hpRatio,16,4);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="left";ctx.fillText("气血 "+G.player.hp+"/"+G.player.maxHp,18,24);
  ctx.textAlign="right";ctx.fillStyle="#ffd27f";ctx.font="bold 16px sans-serif";ctx.fillText("积分 "+G.score,W-14,28);
  ctx.fillStyle="#8fe3ff";ctx.font="12px sans-serif";ctx.fillText("第 "+G.level+" 关 · 击杀 "+G.levelKills+"/"+G.needKills,W-14,46);
  const s=SWORDS[G.sword];ctx.textAlign="left";ctx.fillStyle="rgba(0,0,0,.4)";roundRect(10,38,140,20,5);ctx.fill();
  ctx.fillStyle=s.color;ctx.font="bold 13px sans-serif";ctx.fillText("⚔ "+s.name+" · "+s.desc,18,52);
  if(G.buffTime>0){ctx.fillStyle="rgba(0,0,0,.5)";roundRect(10,62,140,16,4);ctx.fill();ctx.fillStyle="#ffd27f";ctx.font="bold 10px sans-serif";ctx.fillText("⚡ 剑气强化 "+(G.buffTime/60).toFixed(1)+"s",16,73);}
}
function drawBtns(){
  for(let i=0;i<4;i++){const b=BTNS.swords[i],s=SWORDS[i],sel=G.sword===i;
    if(sel){ctx.shadowBlur=18;ctx.shadowColor=s.color;ctx.fillStyle=s.color+"44";}else{ctx.fillStyle="rgba(15,25,45,.7)";}
    roundRect(b.x,b.y,b.w,b.h,8);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=sel?s.color:"rgba(100,150,200,.25)";ctx.lineWidth=sel?2.5:1;roundRect(b.x,b.y,b.w,b.h,8);ctx.stroke();
    ctx.fillStyle=s.color;ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText((i+1),b.x+b.w/2,b.y+15);
    ctx.font="bold 10px sans-serif";ctx.fillText(s.name.slice(0,2),b.x+b.w/2,b.y+29);
    if(s.level>0){ctx.fillStyle="#ffd27f";ctx.font="bold 9px sans-serif";ctx.fillText("+"+s.level,b.x+b.w-8,b.y+11);}
  }
  drawSkillBtn(BTNS.shield,"护体","#7fe0ff",G.shieldCd,480);drawSkillBtn(BTNS.blast,"清屏","#ffd27f",G.blastCd,600);
}
function drawSkillBtn(b,label,col,cd,max){
  const ready=cd<=0;if(ready){ctx.shadowBlur=12;ctx.shadowColor=col;ctx.fillStyle=col+"33";}else{ctx.fillStyle="rgba(20,30,50,.65)";}
  roundRect(b.x,b.y,b.w,b.h,8);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=ready?col:"rgba(100,130,160,.3)";ctx.lineWidth=ready?2:1;roundRect(b.x,b.y,b.w,b.h,8);ctx.stroke();
  ctx.fillStyle=ready?col:"#5a6a80";ctx.font="bold 13px sans-serif";ctx.textAlign="center";ctx.fillText(label,b.x+b.w/2,b.y+b.h/2-1);
  if(!ready){ctx.fillStyle="rgba(0,0,0,.55)";roundRect(b.x,b.y,b.w,b.h*(cd/max),8);ctx.fill();ctx.fillStyle="#cfe0f0";ctx.font="bold 11px sans-serif";ctx.fillText(Math.ceil(cd/60)+"s",b.x+b.w/2,b.y+b.h/2+12);}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function drawMenu(){
  ctx.textAlign="center";
  ctx.fillStyle="#5ac8ff";ctx.font="bold 44px 'Microsoft YaHei'";ctx.shadowBlur=28;ctx.shadowColor="#5ac8ff";ctx.fillText("御剑苍穹",W/2,210);ctx.shadowBlur=0;
  ctx.fillStyle="#7f98b8";ctx.font="14px sans-serif";ctx.fillText("武侠弹幕射击 · 四剑切换 · 闯关首领",W/2,248);
  const names=["青锋·直线","雷纹·散射","流影·追踪","玄重·穿透"];const cols=["#8fe3ff","#ffd27f","#ff9de0","#b9a8ff"];
  for(let i=0;i<4;i++){const x=W/2-100+i*67;ctx.fillStyle=cols[i]+"22";roundRect(x-28,290,56,56,8);ctx.fill();ctx.strokeStyle=cols[i]+"88";ctx.lineWidth=1.5;roundRect(x-28,290,56,56,8);ctx.stroke();ctx.fillStyle=cols[i];ctx.font="bold 16px sans-serif";ctx.fillText((i+1),x,312);ctx.font="bold 9px sans-serif";ctx.fillText(names[i].split("·")[0],x,328);ctx.font="10px sans-serif";ctx.fillText(names[i].split("·")[1],x,362);}
  const btnPulse=Math.sin(G.time*.06)*.15+.85;ctx.globalAlpha=btnPulse;
  ctx.fillStyle="rgba(40,120,200,.5)";ctx.strokeStyle="#6fe0ff";ctx.lineWidth=2;ctx.shadowBlur=16;ctx.shadowColor="#5ac8ff";roundRect(W/2-95,H-125,190,54,12);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;
  ctx.fillStyle="#eaf7ff";ctx.font="bold 22px 'Microsoft YaHei'";ctx.fillText("开 始 游 戏",W/2,H-90);
  ctx.fillStyle="#5a7aa0";ctx.font="11px sans-serif";ctx.fillText("拖动屏幕控制侠客 · 双击侠客切换佩剑 · 单击释放技能",W/2,H-42);
}
function drawOver(){
  ctx.fillStyle="rgba(5,8,18,.82)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
  const win=G.player.hp>0;const col=win?"#6fe0ff":"#ff5d7e";
  ctx.fillStyle=col;ctx.font="bold 38px 'Microsoft YaHei'";ctx.shadowBlur=20;ctx.shadowColor=col;ctx.fillText(win?"胜 利":"剑 陨",W/2,230);ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,255,255,.06)";roundRect(W/2-110,260,220,110,10);ctx.fill();
  ctx.fillStyle="#cfe4ff";ctx.font="15px sans-serif";ctx.fillText("最终积分："+G.score,W/2,295);ctx.fillText("通关关卡：第 "+G.level+" 关",W/2,323);ctx.fillText("击杀敌数："+G.kills,W/2,351);
  ctx.fillStyle="rgba(40,120,200,.55)";ctx.strokeStyle="#6fe0ff";ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor="#5ac8ff";roundRect(W/2-95,H-135,190,54,12);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle="#eaf7ff";ctx.font="bold 20px 'Microsoft YaHei'";ctx.fillText("再 战 一 局",W/2,H-100);
}
function loop(){if(G.state==="play")update();else{G.time++;for(const st of G.stars)st.tw+=st.ts;for(const pt of G.bgPetals){pt.x+=pt.vx;pt.y+=pt.vy;pt.rot+=pt.vr;if(pt.y>H){pt.y=-5;pt.x=Math.random()*W;}}}draw();requestAnimationFrame(loop);}
loop();
